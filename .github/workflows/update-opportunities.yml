name: تحديث فرصتك تلقائيا

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: تثبيت المكتبات
        run: |
          pip install requests beautifulsoup4

      - name: تشغيل scraper
        run: |
          python scraper.py

      - name: حفظ التحديثات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add opportunities.json

          git diff --cached --quiet || git commit -m "تحديث الفرص تلقائيا"

          git push
